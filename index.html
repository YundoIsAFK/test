<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conquest Map Maker</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="hex_map.css" />
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-text">
            <div class="brand-title">Conquest Map Maker</div>
            <div class="brand-sub">Royal Revolt 2</div>
          </div>
          <div id="me-badge" class="me-badge" hidden></div>
        </header>

        <div class="toolbar">
          <button id="undo" class="btn btn-secondary" type="button">&#8630; Undo</button>
          <button id="redo" class="btn btn-secondary" type="button">Redo &#8631;</button>
          <button id="reset" class="btn btn-danger" type="button">Reset</button>
        </div>

        <div class="chips">
          <div class="chip"><span class="chip-label">Buildable</span><span class="chip-value" id="buildable"></span></div>
          <div class="chip"><span class="chip-label">Center</span><span class="chip-value" id="center"></span></div>
          <div class="chip"><span class="chip-label">Points</span><span class="chip-value" id="points"></span></div>
        </div>

        <nav class="tabs" id="tabs">
          <button class="tab-btn active" data-tab="build" type="button">Build</button>
          <button class="tab-btn" data-tab="teams" type="button">Teams</button>
          <button class="tab-btn" data-tab="energy" type="button">Energy</button>
          <button class="tab-btn" data-tab="share" type="button">Share</button>
        </nav>

        <!-- BUILD -->
        <section class="tab-pane" data-pane="build">
          <div class="panel">
            <div class="panel-header"><div class="panel-title">Tools</div></div>
            <div class="panel-body">
              <div class="seg" id="tool-modes">
                <button class="seg-btn active" data-mode="terrain" type="button">Terrain</button>
                <button class="seg-btn" data-mode="tower" type="button">Tower</button>
                <button class="seg-btn" data-mode="hero" type="button">Hero</button>
                <button class="seg-btn" data-mode="erase" type="button">Erase</button>
              </div>

              <div id="tool-options" class="tool-options">
                <div>
                  <div class="field-label">Team</div>
                  <div id="team-picker" class="team-picker"></div>
                </div>

                <div id="level-wrap">
                  <div class="field-label">Level</div>
                  <div id="level-picker" class="level-picker"></div>
                </div>

                <div id="name-wrap">
                  <div class="field-label" id="name-label">Name</div>
                  <input id="piece-name" class="field-input" type="text" maxlength="80" />
                </div>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header"><div class="panel-title">Palette</div></div>
            <div class="panel-body">
              <div class="field">
                <div class="field-label">Theme</div>

                <div id="palette-theme-dropdown" class="dropdown">
                  <button id="palette-theme-btn" class="dropdown-btn" type="button" aria-expanded="false">
                    <span id="palette-theme-label">Grass</span>
                    <span class="dropdown-caret">&#9662;</span>
                  </button>

                  <div id="palette-theme-menu" class="dropdown-menu" role="listbox"></div>
                </div>
              </div>

              <div id="palette" class="palette"></div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header"><div class="panel-title">View</div></div>
            <div class="panel-body">
              <div class="view-toggles">
                <label class="switch"><input id="show-territory" type="checkbox" checked /><span>Territory</span></label>
                <label class="switch"><input id="show-names" type="checkbox" checked /><span>Labels</span></label>
                <label class="switch"><input id="show-costs" type="checkbox" /><span>Energy</span></label>
              </div>
            </div>
          </div>
        </section>

        <!-- TEAMS -->
        <section class="tab-pane" data-pane="teams" hidden>
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">Heroes</div>
              <div class="panel-hint" id="overview-count"></div>
            </div>
            <div class="panel-body">
              <div class="ov-add">
                <input id="ov-name" class="field-input ov-add-name" type="text" maxlength="24" placeholder="Hero name" />
                <input id="ov-pos" class="field-input ov-add-pos" type="text" maxlength="8" placeholder="D32 / SH" />
                <select id="ov-team" class="field-input ov-add-team"></select>
                <button id="ov-add" class="btn" type="button">Add</button>
              </div>
              <div id="ov-msg" class="ov-msg"></div>
              <div id="ov-players" class="ov-list"></div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header"><div class="panel-title">Watchtowers</div></div>
            <div class="panel-body">
              <div id="ov-towers" class="ov-list"></div>
            </div>
          </div>
        </section>

        <!-- ENERGY -->
        <section class="tab-pane" data-pane="energy" hidden>
          <div class="panel">
            <div class="panel-header"><div class="panel-title">Playing as</div></div>
            <div class="panel-body">
              <div id="my-team" class="compass"></div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header"><div class="panel-title">Energy techs</div></div>
            <div class="panel-body">
              <div class="tech-grid">
                <label class="tech">
                  <span class="tech-name">Movement</span>
                  <span class="tech-input"><input id="tech-general" class="field-input" type="number" min="0" max="100" step="1" value="0" /><b>%</b></span>
                </label>
                <label class="tech">
                  <span class="tech-name">Alliance</span>
                  <span class="tech-input"><input id="tech-alliance" class="field-input" type="number" min="0" max="100" step="1" value="0" /><b>%</b></span>
                </label>
                <label class="tech">
                  <span class="tech-name">Enemy</span>
                  <span class="tech-input"><input id="tech-enemy" class="field-input" type="number" min="0" max="100" step="1" value="0" /><b>%</b></span>
                </label>
              </div>
              <div id="tech-summary" class="tech-summary"></div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header"><div class="panel-title">Pathfinder</div></div>
            <div class="panel-body">
              <div class="path-form">
                <div class="path-point">
                  <span class="path-badge a">A</span>
                  <input id="path-from" class="field-input" type="text" maxlength="8" placeholder="Start" />
                  <button id="path-sh" class="sh-btn" type="button" title="Start from the stronghold">SH</button>
                </div>
                <div class="path-point">
                  <span class="path-badge b">B</span>
                  <input id="path-to" class="field-input" type="text" maxlength="8" placeholder="Destination" />
                </div>
              </div>

              <div class="path-options">
                <label class="inline-field">Tiles per move <input id="path-per-move" class="field-input" type="number" min="1" max="20" step="1" value="4" /></label>
                <button id="path-clear" class="btn btn-secondary" type="button">Clear</button>
              </div>

              <div id="path-result" class="path-result"></div>
            </div>
          </div>
        </section>

        <!-- SHARE -->
        <section class="tab-pane" data-pane="share" hidden>
          <div class="panel">
            <div class="panel-header"><div class="panel-title">Export / Import</div></div>
            <div class="panel-body">
              <div class="share-grid">
                <button id="export-json" class="btn btn-secondary" type="button">Export JSON</button>
                <button id="export-code" class="btn btn-secondary" type="button">Export Code</button>
                <button id="export-png" class="btn btn-secondary" type="button">Export PNG</button>
                <button id="import" class="btn" type="button">Import</button>
              </div>
            </div>
          </div>
        </section>
      </aside>

      <main class="main">
        <div id="path-banner" class="path-banner" hidden></div>
        <div id="strongholds" class="docks docks-top"></div>
        <div id="grid" class="grid"></div>
        <div id="strongholds-bottom" class="docks docks-bottom"></div>
      </main>
    </div>

    <div id="inspector" class="inspector" hidden></div>
    <div id="hover-info" class="hover-info" hidden></div>

    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-header">
          <div id="modal-title" class="modal-title">Export</div>
          <button id="modal-close" class="icon-btn" type="button">&#10005;</button>
        </div>

        <div class="modal-body">
          <textarea id="modal-text" class="modal-text" spellcheck="false"></textarea>
          <div id="modal-hint" class="modal-hint"></div>
        </div>

        <div class="modal-footer">
          <button id="modal-secondary" class="btn btn-secondary" type="button">Close</button>
          <button id="modal-primary" class="btn" type="button">Copy</button>
        </div>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="sprites.js"></script>
    <script src="conquest.js"></script>
    <script src="hex_map.js"></script>
  </body>
</html>
